name: Deploy

on:
  workflow_dispatch:

jobs:
  demo-run:
    name: Smoke test the published image (manual)
    runs-on: ubuntu-latest

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the published image and check /readyz
        run: |
          docker pull ghcr.io/${{ github.repository }}:latest
          docker run -d --name iris-mlops-smoke -p 3000:3000 ghcr.io/${{ github.repository }}:latest
          for i in $(seq 1 15); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/readyz || echo "000")
            [ "$CODE" = "200" ] && echo "OK: /readyz respondeu 200" && exit 0
            echo "Tentativa $i: /readyz respondeu $CODE"
            sleep 3
          done
          docker logs iris-mlops-smoke
          exit 1
